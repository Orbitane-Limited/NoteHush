name: App Store delivery

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful complete CI run for this exact main commit
        required: true
        type: string

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: notehush-app-store-delivery
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify source and signing protection
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, notehush, xcode-26.6]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify current disk headroom
        run: python3 scripts/check_runner_storage.py
      - name: Verify complete main CI and protected environment
        env:
          GH_TOKEN: ${{ github.token }}
          NOTEHUSH_CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: python3 scripts/store_preflight.py
      - name: Retain capacity reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NoteHush-store-preflight-storage-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/logs/runner-storage-*.json
          if-no-files-found: error
          retention-days: 14

  sign-and-upload:
    name: Sign and upload Store candidate
    needs: preflight
    if: github.ref == 'refs/heads/main'
    environment: app-store
    runs-on: [self-hosted, macOS, ARM64, notehush, xcode-26.6]
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify, sign, validate and upload
        env:
          GH_TOKEN: ${{ github.token }}
          NOTEHUSH_CI_RUN_ID: ${{ inputs.ci_run_id }}
          STORE_TEAM_ID: ${{ vars.STORE_TEAM_ID }}
          STORE_CONFIRMED_BUNDLE_ID: ${{ vars.STORE_CONFIRMED_BUNDLE_ID }}
          STORE_APP_ID: ${{ vars.STORE_APP_ID }}
          STORE_APP_CERTIFICATE_SHA1: ${{ vars.STORE_APP_CERTIFICATE_SHA1 }}
          STORE_INSTALLER_CERTIFICATE_SHA1: ${{ vars.STORE_INSTALLER_CERTIFICATE_SHA1 }}
          STORE_INSTALLER_CERTIFICATE_SHA256: ${{ vars.STORE_INSTALLER_CERTIFICATE_SHA256 }}
          STORE_API_KEY_ID: ${{ vars.STORE_API_KEY_ID }}
          STORE_API_ISSUER_ID: ${{ vars.STORE_API_ISSUER_ID }}
          STORE_SIGNING_P12_BASE64: ${{ secrets.STORE_SIGNING_P12_BASE64 }}
          STORE_SIGNING_P12_PASSWORD: ${{ secrets.STORE_SIGNING_P12_PASSWORD }}
          STORE_PROFILE_BASE64: ${{ secrets.STORE_PROFILE_BASE64 }}
          STORE_API_KEY_BASE64: ${{ secrets.STORE_API_KEY_BASE64 }}
        run: python3 scripts/store_delivery.py
      - name: Remove this run's signing assets
        if: always()
        run: python3 scripts/store_delivery.py --cleanup
      - name: Retain capacity reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NoteHush-store-native-storage-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/logs/runner-storage-*.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain only verified candidate and report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NoteHush-APP-STORE-${{ github.sha }}-${{ github.run_number }}
          path: build/store-delivery/${{ github.run_id }}-${{ github.run_attempt }}/Verified/
          if-no-files-found: error
          retention-days: 14
