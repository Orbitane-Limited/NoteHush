name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate, test, build and archive
        run: bash scripts/check.sh
      - name: Package unsigned engineering archive
        run: tar -czf build/NoteHush-UNSIGNED.xcarchive.tar.gz -C build NoteHush-unsigned.xcarchive
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-${{ github.sha }}
          path: build/logs/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload unsigned archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NoteHush-UNSIGNED-${{ github.sha }}
          path: build/NoteHush-UNSIGNED.xcarchive.tar.gz
          retention-days: 7
          if-no-files-found: error
