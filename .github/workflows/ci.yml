name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, notehush, xcode-26.6]
    # Full validation takes ~10 minutes; verification bundles can require another
    # 12 minutes to upload from this host. Per-test limits remain in test_app.sh.
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check runner disk headroom
        run: python3 scripts/check_runner_storage.py
      - name: Validate, test, build and archive
        run: bash scripts/check.sh
      - name: Package unsigned engineering archive
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: tar -czf build/NoteHush-UNSIGNED.xcarchive.tar.gz -C build NoteHush-unsigned.xcarchive
      - name: Upload unsigned archive
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NoteHush-UNSIGNED-${{ github.sha }}
          path: build/NoteHush-UNSIGNED.xcarchive.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Upload verification logs after failure or cancellation
        id: upload_ci_logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-${{ github.sha }}
          path: build/logs/
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve verification logs locally if upload fails
        if: always() && steps.upload_ci_logs.outcome != 'success' && steps.upload_ci_logs.outcome != 'skipped'
        run: python3 scripts/preserve_ci_failure_logs.py
