name: App Store delivery

on:
  workflow_dispatch:
    inputs:
      confirm_upload:
        description: Upload this signed build to App Store Connect for TestFlight processing
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: notehush-app-store-delivery
  cancel-in-progress: false

jobs:
  signed-delivery:
    name: Verify, sign, and upload candidate
    if: github.ref == 'refs/heads/main' && inputs.confirm_upload == true
    runs-on: macos-26
    timeout-minutes: 120
    environment:
      name: app-store
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check runner disk headroom
        run: python3 scripts/check_runner_storage.py

      - name: Run the complete release validation at this exact commit
        run: bash scripts/check.sh

      - name: Create and verify signed candidate
        env:
          MAC_APP_DISTRIBUTION_P12_BASE64: ${{ secrets.MAC_APP_DISTRIBUTION_P12_BASE64 }}
          MAC_APP_DISTRIBUTION_P12_PASSWORD: ${{ secrets.MAC_APP_DISTRIBUTION_P12_PASSWORD }}
          MAC_INSTALLER_DISTRIBUTION_P12_BASE64: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_P12_BASE64 }}
          MAC_INSTALLER_DISTRIBUTION_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_P12_PASSWORD }}
          MAC_APP_STORE_PROFILE_BASE64: ${{ secrets.MAC_APP_STORE_PROFILE_BASE64 }}
        run: python3 scripts/app_store_delivery.py stage

      - name: Upload the signed package and checksum
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NoteHush-App-Store-${{ github.sha }}
          path: |
            build/app-store-export/NoteHush.pkg
            build/app-store-export/SHA256SUMS
            build/app-store-export/DELIVERY-MANIFEST.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload verified package to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: python3 scripts/app_store_delivery.py upload

      - name: Clean up temporary signing material
        if: always()
        run: python3 scripts/app_store_delivery.py cleanup

      - name: Upload diagnostics after failure or cancellation
        id: upload_delivery_logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-store-delivery-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Preserve diagnostics locally if artifact upload fails
        if: always() && steps.upload_delivery_logs.outcome != 'success' && steps.upload_delivery_logs.outcome != 'skipped'
        run: python3 scripts/preserve_ci_failure_logs.py
