name: Hosted idle Allocations diagnostic

on:
  push:
    branches: [issue-67/empty-workspace-memory]
    paths:
      - .github/workflows/hosted-idle-allocations.yml
      - scripts/profile_idle_allocations.sh
      - Tests/PerformanceFixtureHarness/**
      - Tests/NativeFixtureSupport/**
      - Sources/NoteHushCore/**
      - App/NoteHush/**
      - Config/**
      - Package.swift
      - project.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notehush-hosted-idle-allocations
  cancel-in-progress: false

jobs:
  allocations:
    name: Isolated generated-app Allocations traces
    runs-on: macos-26
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      NOTEHUSH_EXCLUSIVE_INPUT: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record runner and source provenance
        run: |
          set -euo pipefail
          printf 'commit=%s\n' "$(git rev-parse HEAD)"
          printf 'architecture=%s\n' "$(uname -m)"
          printf 'macOS='; sw_vers -productVersion
          printf 'hardware_model='; sysctl -n hw.model
          xcodebuild -version
          swift --version

      - name: Check runner disk headroom
        run: python3 scripts/check_runner_storage.py

      - name: Capture isolated empty and 20-tab allocations
        id: allocations
        run: bash scripts/profile_idle_allocations.sh

      - name: Upload trace and fixture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-idle-allocations-${{ github.sha }}-${{ github.run_attempt }}
          path: build/logs/Allocations-*/
          retention-days: 3
          if-no-files-found: warn
