name: Long paragraph wrap control

on:
  push:
    branches: [issue-75/long-paragraphs]
    paths:
      - docs/validation/reproducers/TextKit2WrapControlProbe.swift
      - docs/validation/reproducers/run-textkit2-wrap-control.py
      - .github/workflows/long-paragraph-wrap-control.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  textkit2-wrap-control:
    name: Generated TextKit 2 wrap comparison
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record host and source provenance
        run: |
          set -euo pipefail
          printf 'commit=%s\n' "$(git rev-parse HEAD)"
          printf 'architecture=%s\n' "$(uname -m)"
          printf 'macOS='; sw_vers -productVersion
          printf 'hardware_model='; sysctl -n hw.model
          xcodebuild -version
          swift --version

      - name: Check runner disk headroom
        run: python3 scripts/check_runner_storage.py

      - name: Run bounded generated controls
        run: python3 docs/validation/reproducers/run-textkit2-wrap-control.py

      - name: Upload complete outcomes and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: long-paragraph-wrap-${{ github.sha }}-${{ github.run_attempt }}
          path: build/logs/TextKit2WrapControl-*/
          retention-days: 7
          if-no-files-found: error
