name: Hosted Automation Mode status

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: notehush-automation-mode-status
  cancel-in-progress: false

jobs:
  status:
    name: Read hosted runner Automation Mode status
    runs-on: macos-26
    timeout-minutes: 2
    steps:
      - name: Read status without changing authorization
        shell: bash
        run: /usr/bin/automationmodetool
