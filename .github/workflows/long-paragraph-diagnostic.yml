name: Long paragraph diagnostic

on:
  push:
    branches: [issue-75/long-paragraphs]
    paths:
      - App/NoteHush/Editor/**
      - Sources/NoteHushCore/**
      - Tests/LargeFileOpenHarness/**
      - Tests/NativeFixtureSupport/**
      - Tests/NativeFixtureSupportTests/**
      - scripts/build_performance.sh
      - scripts/test_large_open.py
      - scripts/test_long_paragraph.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notehush-long-paragraph-diagnostic
  cancel-in-progress: false

jobs:
  current-candidate:
    name: Current app candidate on isolated macOS VM
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record runner and source provenance
        run: |
          set -euo pipefail
          printf 'commit=%s\n' "$(git rev-parse HEAD)"
          printf 'architecture=%s\n' "$(uname -m)"
          printf 'macOS='; sw_vers -productVersion
          printf 'hardware_model='; sysctl -n hw.model
          xcodebuild -version
          swift --version

      - name: Check runner disk headroom
        run: python3 scripts/check_runner_storage.py

      - name: Run one generated 10 MiB paragraph observation
        env:
          NOTEHUSH_EXCLUSIVE_INPUT: "1"
        run: python3 scripts/test_long_paragraph.py --bytes 10485760

      - name: Preserve sanitized numeric outcome in job log
        if: always()
        run: |
          for evidence in build/logs/LargeOpen-*/context.json build/logs/LargeOpen-*/observations.jsonl; do
            if [[ -f "$evidence" ]]; then
              cat "$evidence"
            fi
          done

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: long-paragraph-${{ github.sha }}-${{ github.run_attempt }}
          path: build/logs/
          retention-days: 3
          if-no-files-found: error
