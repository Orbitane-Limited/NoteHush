name: NoteHush
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
configs:
  Debug: debug
  DebugUITesting: debug
  Release: release
configFiles:
  Debug: Config/Version.xcconfig
  DebugUITesting: Config/Version.xcconfig
  Release: Config/Version.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    NOTEHUSH_TEST_WORKSPACE_REQUIRED: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    DebugUITesting:
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG NOTEHUSH_REQUIRE_TEST_WORKSPACE"
      NOTEHUSH_TEST_WORKSPACE_REQUIRED: YES
    Release:
      ONLY_ACTIVE_ARCH: NO
      ARCHS: "arm64 x86_64"
      SWIFT_COMPILATION_MODE: wholemodule
packages:
  NoteHushCore:
    path: .
targets:
  NoteHush:
    type: application
    platform: macOS
    sources:
      - path: App/NoteHush
        excludes: [Info.plist]
    dependencies:
      - package: NoteHushCore
        product: NoteHushCore
    info:
      path: App/NoteHush/Info.plist
      properties:
        CFBundleDisplayName: NoteHush
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NoteHushRequiresTestWorkspace: "$(NOTEHUSH_TEST_WORKSPACE_REQUIRED)"
        NSHumanReadableCopyright: "Copyright © 2026 CodeHubdotPk"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Plain Text
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text, public.source-code, public.json, public.shell-script]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pk.codehub.NoteHush
        CODE_SIGN_ENTITLEMENTS: Config/NoteHush.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: pk.codehub.NoteHush.Development
        DebugUITesting:
          PRODUCT_BUNDLE_IDENTIFIER: pk.codehub.NoteHush.UITesting
  NoteHushUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/NoteHushUITests]
    dependencies:
      - target: NoteHush
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pk.codehub.NoteHush.UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NoteHush
  NoteHushAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/NoteHushAppTests
      - App/NoteHush/Editor
      - App/NoteHush/Workspace
      - App/NoteHush/Preferences
      - App/NoteHush/Printing
    dependencies:
      - package: NoteHushCore
        product: NoteHushCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pk.codehub.NoteHush.AppTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NoteHush:
    build:
      targets:
        NoteHush: all
    run:
      config: Debug
    test:
      config: DebugUITesting
      targets:
        - NoteHushAppTests
        - NoteHushUITests
    archive:
      config: Release
